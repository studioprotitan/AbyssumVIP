<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CST // COLD BREW — MYSTICS OF MAYHEM EP.01</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020306;
  --panel:#080d18;
  --panel2:#0d1525;
  --border:#1a2a40;
  --gold:#c8920a;
  --gold-bright:#f0b030;
  --cyan:#00d4ff;
  --red:#ff2a2a;
  --green:#00ff88;
  --purple:#9d4dff;
  --text:#dde8f0;
  --dim:#5a7090;
  --scan:#ffffff08;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--void);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* SCANLINES */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px);
  pointer-events:none;
  z-index:9999;
}

/* TOPBAR HUD */
#hud{
  position:fixed;top:0;left:0;right:0;
  background:#00000099;
  border-bottom:1px solid var(--gold);
  backdrop-filter:blur(8px);
  padding:0 20px;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:500;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  gap:12px;
}
.hud-brand{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:3px;}
.hud-center{display:flex;gap:20px;align-items:center;}
.hud-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hud-label{color:var(--dim);font-size:9px;letter-spacing:2px;}
.hud-val{color:var(--cyan);font-size:12px;}
.hud-right{display:flex;gap:10px;align-items:center;}

/* THREAT BAR */
.threat-wrap{width:120px;}
.threat-track{height:4px;background:#111;border:1px solid #333;border-radius:2px;overflow:hidden;}
.threat-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:0%;transition:width 0.8s cubic-bezier(.4,0,.2,1);}

/* MAIN READER */
#main{
  max-width:780px;
  margin:0 auto;
  padding:70px 20px 200px;
}

/* SCENE PANEL */
#scene-wrap{
  position:relative;
}

.scene-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
  border-bottom:1px solid var(--border);
  padding-bottom:10px;
}
.scene-id{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:var(--dim);
  letter-spacing:3px;
}
.scene-status{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:var(--green);
  letter-spacing:2px;
}

/* VISUAL PANEL */
.vis-panel{
  width:100%;
  height:280px;
  border:1px solid var(--border);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.vis-bg{
  position:absolute;inset:0;
}
.vis-label{
  position:absolute;
  font-family:'Orbitron',monospace;
  font-size:11px;
  letter-spacing:4px;
  color:rgba(255,255,255,0.12);
  text-align:center;
  padding:20px;
  z-index:1;
}
.vis-icon{
  font-size:72px;
  z-index:2;
  filter:drop-shadow(0 0 20px currentColor);
}
.vis-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom, transparent 40%, var(--void) 100%);
  z-index:3;
}

/* NARRATION */
#narration-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--gold);
  padding:20px 24px;
  margin-bottom:16px;
  min-height:80px;
  position:relative;
}
#narration-text{
  font-size:16px;
  line-height:1.7;
  font-weight:400;
  color:#c8d8e8;
}
.narration-cursor{
  display:inline-block;
  width:2px;height:16px;
  background:var(--gold);
  margin-left:2px;
  animation:blink 0.8s infinite;
  vertical-align:middle;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.narration-read-btn{
  position:absolute;top:12px;right:12px;
  background:transparent;border:1px solid var(--border);
  color:var(--dim);font-size:14px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:2px;
  transition:all 0.2s;
}
.narration-read-btn:hover{color:var(--gold);border-color:var(--gold);}

/* ALERT BANNER */
#alert-banner{
  display:none;
  background:#ff2a2a18;
  border:1px solid var(--red);
  border-left:3px solid var(--red);
  padding:10px 16px;
  margin-bottom:12px;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  color:var(--red);
  letter-spacing:2px;
}

/* CHOICES */
#choices-panel{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:32px;
  scroll-margin-bottom:120px;
}
.choice-btn{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:14px 20px;
  font-family:'Rajdhani',sans-serif;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  text-align:left;
  position:relative;
  transition:all 0.2s;
  display:flex;align-items:center;gap:12px;
  letter-spacing:1px;
}
.choice-btn:hover{
  background:var(--panel2);
  border-color:var(--gold);
  color:var(--gold-bright);
  padding-left:28px;
}
.choice-btn::before{
  content:'▸';
  color:var(--gold);
  opacity:0;
  transition:opacity 0.2s;
}
.choice-btn:hover::before{opacity:1;}
.choice-btn.card-gated{border-color:#9d4dff44;color:#c0a0ff;}
.choice-btn.card-gated::after{
  content:attr(data-card);
  position:absolute;right:14px;
  font-family:'Share Tech Mono',monospace;
  font-size:9px;
  color:var(--purple);
  letter-spacing:2px;
}
.choice-btn.card-gated:hover{border-color:var(--purple);color:#ddc0ff;}
.choice-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* BOTTOM ROSTER */
#roster-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#000000cc;
  border-top:1px solid var(--border);
  backdrop-filter:blur(8px);
  padding:8px 20px;
  display:flex;gap:8px;align-items:center;
  z-index:500;
  overflow-x:auto;
}
.roster-label{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;
  color:var(--dim);
  letter-spacing:2px;
  white-space:nowrap;
  margin-right:4px;
}
.unit-chip{
  background:var(--panel);
  border:1px solid var(--border);
  padding:5px 10px 5px 8px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  cursor:pointer;
  white-space:nowrap;
  transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
  border-radius:2px;
  position:relative;
}
.unit-chip:hover{border-color:var(--gold);color:var(--gold);}
.unit-chip.unlocked{border-color:#333;}
.unit-chip.locked{opacity:0.4;cursor:default;}
.unit-chip .chip-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--dim);flex-shrink:0;
}
.unit-chip.unlocked .chip-dot{background:var(--green);}
.unit-chip.locked .chip-dot{background:#333;}

/* UNIT DB MODAL */
#unit-modal{
  position:fixed;top:0;right:-500px;width:460px;height:100%;
  background:#050a14;
  border-left:1px solid var(--gold);
  z-index:800;
  overflow-y:auto;
  transition:right 0.4s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#unit-modal.open{right:0;}
#modal-close{
  position:sticky;top:0;
  background:#050a14;
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:10;
}
#modal-close-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--dim);font-size:16px;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:2px;transition:all 0.2s;
}
#modal-close-btn:hover{color:var(--red);border-color:var(--red);}
.modal-title{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--dim);letter-spacing:3px;
}

/* UNIT PORTRAIT */
.unit-portrait{
  width:100%;
  height:200px;
  display:flex;align-items:center;justify-content:center;
  font-size:80px;
  position:relative;
  overflow:hidden;
}
.unit-portrait::before{
  content:'';
  position:absolute;inset:0;
  opacity:0.15;
}
.portrait-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,#050a14);
  height:60px;
}

/* UNIT INFO SECTIONS */
.unit-section{padding:16px 20px;border-bottom:1px solid var(--border);}
.unit-name{
  font-family:'Orbitron',monospace;
  font-size:18px;font-weight:900;
  margin-bottom:4px;
}
.unit-class{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:3px;color:var(--dim);
}
.unit-lore{
  font-size:14px;line-height:1.6;color:#9ab0c8;
  margin-top:10px;
}

/* STATUS BADGE */
.status-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;
  border:1px solid;
  font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:2px;
  margin-top:10px;border-radius:2px;
}
.status-badge.active{border-color:var(--green);color:var(--green);}
.status-badge.locked{border-color:var(--dim);color:var(--dim);}
.status-badge.boss{border-color:var(--red);color:var(--red);}

/* LOADOUT */
.loadout-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.loadout-item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:8px 12px;
  font-size:13px;
}
.loadout-icon{font-size:16px;}
.loadout-name{font-weight:600;color:var(--text);}
.loadout-desc{font-size:11px;color:var(--dim);margin-top:2px;}

/* SKILL TREE */
.skill-tree{
  display:flex;flex-direction:column;gap:4px;
  margin-top:12px;
}
.skill-row{
  display:flex;align-items:center;gap:0;
}
.skill-node{
  background:var(--panel);
  border:1px solid var(--border);
  padding:10px 14px;
  flex:1;
  cursor:default;
  position:relative;
  transition:all 0.2s;
}
.skill-node.active{border-color:currentColor;}
.skill-node.locked{opacity:0.45;}
.skill-node-name{font-size:12px;font-weight:700;letter-spacing:1px;}
.skill-node-desc{font-size:10px;color:var(--dim);margin-top:3px;}
.skill-node-type{
  position:absolute;top:6px;right:8px;
  font-family:'Share Tech Mono',monospace;
  font-size:8px;letter-spacing:1px;
  color:var(--dim);
}
.skill-connector{
  width:24px;height:1px;
  background:var(--border);
  flex-shrink:0;
}
.skill-connector.active{background:currentColor;opacity:0.5;}

/* SECTION LABEL */
.section-label{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:3px;color:var(--gold);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.section-label::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* ENDING SCREEN */
#ending{
  display:none;
  position:fixed;inset:0;
  background:var(--void);
  z-index:900;
  flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px;
  text-align:center;
}
#ending.show{display:flex;}
.ending-type{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:5px;
  margin-bottom:20px;
}
.ending-title{
  font-family:'Orbitron',monospace;
  font-size:36px;font-weight:900;
  margin-bottom:20px;
  line-height:1.2;
}
.ending-body{
  font-size:17px;color:#9ab0c8;max-width:500px;
  line-height:1.7;margin-bottom:40px;
}
.ending-restart{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:12px 30px;
  font-family:'Orbitron',monospace;
  font-size:12px;letter-spacing:3px;
  cursor:pointer;
  transition:all 0.2s;
}
.ending-restart:hover{background:var(--gold);color:#000;}

/* CARD EARN POPUP */
#card-popup{
  position:fixed;top:70px;right:20px;
  background:var(--panel);
  border:1px solid var(--gold);
  padding:14px 18px;
  display:none;
  z-index:700;
  max-width:260px;
  animation:slideIn 0.3s ease;
}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.popup-header{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:var(--gold);letter-spacing:3px;margin-bottom:8px;
}
.popup-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.popup-desc{font-size:11px;color:var(--dim);}

/* SCREEN SHAKE */
@keyframes shake{
  0%{transform:translate(0,0)}
  20%{transform:translate(-4px,3px)}
  40%{transform:translate(4px,-3px)}
  60%{transform:translate(-3px,4px)}
  80%{transform:translate(3px,-2px)}
  100%{transform:translate(0,0)}
}
.shaking{animation:shake 0.4s ease;}

/* SCENE TRANSITION */
@keyframes sceneFade{
  0%{opacity:0;filter:brightness(3) saturate(0)}
  30%{opacity:1;filter:brightness(1.2)}
  100%{opacity:1;filter:brightness(1)}
}
#scene-wrap{animation:sceneFade 0.6s ease;}

/* GLITCH PULSE */
@keyframes glitchPulse{
  0%{clip-path:inset(0 0 100% 0)}
  10%{clip-path:inset(30% 0 40% 0)}
  20%{clip-path:inset(70% 0 10% 0)}
  30%{clip-path:inset(10% 0 80% 0)}
  40%{clip-path:inset(0 0 100% 0)}
  100%{clip-path:inset(0 0 100% 0)}
}

#glitch-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:rgba(0,212,255,0.03);
  opacity:0;transition:opacity 0.1s;
}
#glitch-overlay.active{opacity:1;animation:glitchPulse 0.15s steps(1);}

/* HUD AUDIO INDICATOR */
.audio-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--dim);
  display:inline-block;
  transition:background 0.3s;
}
.audio-dot.active{background:var(--green);animation:audioPulse 1s infinite;}
@keyframes audioPulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#000;}
::-webkit-scrollbar-thumb{background:var(--border);}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}

/* RESPONSIVE */
@media(max-width:500px){
  .vis-panel{height:200px;}
  .unit-modal{width:100%;}
  #hud{padding:0 10px;}
  .hud-center{gap:12px;}
}

/* MISC */
.highlight{color:var(--gold);}
.text-cyan{color:var(--cyan);}
.text-red{color:var(--red);}
.text-green{color:var(--green);}
.text-purple{color:var(--purple);}
</style>
</head>
<body>

<!-- GLITCH OVERLAY -->
<div id="glitch-overlay"></div>

<!-- TOP HUD -->
<div id="hud">
  <div class="hud-brand">CST // EP.01</div>
  <div class="hud-center">
    <div class="hud-stat">
      <div class="hud-label">MISSION</div>
      <div class="hud-val" id="hud-mission">COLD BREW</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">THREAT</div>
      <div class="threat-wrap">
        <div class="threat-track"><div class="threat-fill" id="threat-fill"></div></div>
      </div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">CARDS</div>
      <div class="hud-val" id="hud-cards">0/6</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">STATUS</div>
      <div class="hud-val" id="hud-status">ACTIVE</div>
    </div>
  </div>
  <div class="hud-right">
    <span class="audio-dot" id="audio-dot"></span>
    <button onclick="toggleNarration()" style="background:transparent;border:1px solid var(--border);color:var(--dim);padding:4px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:2px;" id="narr-btn">NARR OFF</button>
  </div>
</div>

<!-- MAIN SCENE -->
<div id="main">
  <div id="scene-wrap">
    <div class="scene-header">
      <div class="scene-id" id="scene-id-label">SCENE_INTRO</div>
      <div class="scene-status" id="scene-status">● LIVE</div>
    </div>

    <!-- VISUAL PANEL -->
    <div class="vis-panel" id="vis-panel">
      <div class="vis-bg" id="vis-bg"></div>
      <div class="vis-icon" id="vis-icon">🚁</div>
      <div class="vis-label" id="vis-label">SWAMP WARDS — SECTOR 7</div>
      <div class="vis-overlay"></div>
    </div>

    <!-- ALERT BANNER -->
    <div id="alert-banner" id="alert"></div>

    <!-- NARRATION -->
    <div id="narration-box">
      <div id="narration-text"></div>
      <button class="narration-read-btn" onclick="speakNarration()" title="Read aloud">🔊</button>
    </div>

    <!-- CHOICES -->
    <div id="choices-panel"></div>

    <!-- CARD UNLOCK AREA -->
    <div id="unlock-info" style="display:none;background:var(--panel);border:1px solid #9d4dff44;border-left:3px solid var(--purple);padding:14px 18px;margin-bottom:12px;">
      <div class="section-label">FIELD INTELLIGENCE</div>
      <div id="unlock-text" style="font-size:13px;color:#c0a0ff;line-height:1.6;"></div>
    </div>
  </div>
</div>

<!-- BOTTOM ROSTER -->
<div id="roster-bar">
  <div class="roster-label">UNIT DB ▸</div>
  <div id="roster-chips"></div>
</div>

<!-- UNIT DATABASE MODAL -->
<div id="unit-modal">
  <div id="modal-close">
    <div class="modal-title">// UNIT DOSSIER</div>
    <button id="modal-close-btn" onclick="closeModal()">✕</button>
  </div>
  <div id="modal-body"></div>
</div>

<!-- CARD UNLOCK POPUP -->
<div id="card-popup">
  <div class="popup-header">▲ UNIT CARD ACQUIRED</div>
  <div class="popup-name" id="popup-name"></div>
  <div class="popup-desc" id="popup-desc"></div>
</div>

<!-- ENDING SCREEN -->
<div id="ending">
  <div class="ending-type" id="ending-type"></div>
  <div class="ending-title" id="ending-title"></div>
  <div class="ending-body" id="ending-body"></div>
  <button class="ending-restart" onclick="restartGame()">⟳ RESTART MISSION</button>
</div>

<script>
/* =============================================
   CST EPISODE 01 — COLD BREW ENGINE
   Version: FULL DEPLOYMENT
   Systems: Scene Engine, Card DB, Audio, Cinematic
   ============================================= */

// ── UNIT DATABASE ──────────────────────────────
const UNITS = {
  forge_mystic: {
    id:'forge_mystic',

    icon:'⚙️',
    class:'ARCANE-MECHANICAL SPECIALIST',
    rank:'SENIOR OPERATIVE',
    color:'#c8920a',
    lore:"Born in the Corgemon furnace districts, the Forge Mystic bridges ancient glyph-work with diesel-era mechanics. They do not fight the environment — they become it. Pipe systems obey their will, steam becomes a weapon, and arcane cores bend to their touch.",
    loadout:[
      {icon:'🔧',name:'Glyph Wrench',desc:'Rewrites mechanical behavior at contact. Can reverse enemy turrets.'},
      {icon:'🔥',name:'Core Siphon',desc:'Drains power from arcane machinery, redirects to squad systems.'},
      {icon:'🛡️',name:'Steam Aegis',desc:'Deploys pressurized steam wall. Blocks projectiles and Rift surges.'}
    ],
    skills:[
      {name:'CORE FLOW',desc:'Stabilize or redirect arcane machinery.',type:'ACTIVE',active:true},
      {name:'STEAM WALL',desc:'Tactical steam barrier. -40% projectile damage.',type:'PASSIVE',active:true},
      {name:'FORGE COMMUNION',desc:'Full machine control in radius. Boss-tier interaction.',type:'ULTIMATE',active:false,locked:true}
    ]
  },
  rail_worker: {
    id:'rail_worker',
    name:'RAIL WORKER',
    icon:'🚂',
    class:'INFRASTRUCTURE SPECIALIST',
    rank:'FIELD OPERATIVE',
    color:'#00d4ff',
    lore:"They know every submerged tunnel, rusted switching station, and maintenance bypass in the Swamp Wards. Rail Workers don't walk into a location — they were already there, waiting. Their maps live in muscle memory, not databanks.",
    loadout:[
      {icon:'🗺️',name:'Ward Map Implant',desc:'Neural-mapped tunnel network. Reveals all hidden routes.'},
      {icon:'🔩',name:'Track Spike Launcher',desc:'Fires electrified rail spikes. Stuns mechanical enemies.'},
      {icon:'🚇',name:'Rail Authority Badge',desc:'Opens any CST-maintained gate, lock, or access shaft.'}
    ],
    skills:[
      {name:'TUNNEL SENSE',desc:'Detect hidden passages and maintenance shafts.',type:'PASSIVE',active:true},
      {name:'RAIL BYPASS',desc:'Open restricted infrastructure routes.',type:'ACTIVE',active:true},
      {name:'GHOST TRANSIT',desc:'Move entire squad undetected through rail network.',type:'ULTIMATE',active:false,locked:true}
    ]

// ── AUDIO ENGINE ────────────────────────────────
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq,dur,type='sine',vol=0.08,delay=0){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,ctx.currentTime+delay);
    gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+delay+0.05);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+dur);
    osc.start(ctx.currentTime+delay);
    osc.stop(ctx.currentTime+delay+dur+0.1);
  }catch(e){}
}

// ── NARRATION ───────────────────────────────────
let currentSpeech = null;
function speakNarration(){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const text = document.getElementById('narration-text').innerText.replace(/\n/g,' ');
  if(!text.trim()) return;
  currentSpeech = new SpeechSynthesisUtterance(text);
  currentSpeech.rate = 0.88;
  currentSpeech.pitch = 0.85;
  currentSpeech.volume = 0.9;
  const dot = document.getElementById('audio-dot');
  dot.classList.add('active');
  currentSpeech.onend = ()=>dot.classList.remove('active');
  speechSynthesis.speak(currentSpeech);
}

function toggleNarration(){
  STATE.narrationOn = !STATE.narrationOn;
  document.getElementById('narr-btn').innerText = STATE.narrationOn ? 'NARR ON' : 'NARR OFF';
  document.getElementById('narr-btn').style.color = STATE.narrationOn ? 'var(--green)' : 'var(--dim)';
  if(!STATE.narrationOn && speechSynthesis) speechSynthesis.cancel();
}

// ── TYPEWRITER ──────────────────────────────────
function typeWrite(text, el, speed=18, callback){
  if(STATE.typewriterTimeout) clearTimeout(STATE.typewriterTimeout);
  el.innerHTML='';
  const cursor = document.createElement('span');
  cursor.className='narration-cursor';
  let i=0;
  STATE.typewriterActive=true;
  function step(){
    if(i<text.length){
      const ch=text[i];
      if(ch==='\n'){el.appendChild(document.createElement('br'));}
      else{el.appendChild(document.createTextNode(ch));}
      i++;
      STATE.typewriterTimeout=setTimeout(step,ch==='\n'?speed*6:speed);
    } else {
      STATE.typewriterActive=false;
      el.removeChild(cursor);
      if(callback) callback();
    }
  }
  el.appendChild(cursor);
  step();
}

// ── GLITCH EFFECT ────────────────────────────────
function triggerGlitch(duration=150){
  const g=document.getElementById('glitch-overlay');
  g.classList.add('active');
  setTimeout(()=>g.classList.remove('active'),duration);
}

function screenShake(dur=400){
  const el=document.getElementById('main');
  el.classList.add('shaking');
  setTimeout(()=>el.classList.remove('shaking'),dur);
}

// ── SCENE TRANSITION ─────────────────────────────
function triggerTransition(cb){
  triggerGlitch(200);
  playSceneTransition();
  setTimeout(()=>{
    document.getElementById('scene-wrap').style.opacity='0';
    setTimeout(()=>{
      if(cb) cb();
      document.getElementById('scene-wrap').style.transition='none';
      document.getElementById('scene-wrap').style.opacity='1';
      setTimeout(()=>document.getElementById('scene-wrap').style.transition='',50);
    },200);
  },50);
}

  const unit = UNITS[cardId];
  if(!unit) return;
  // Show popup
  const p = document.getElementById('card-popup');
  document.getElementById('popup-name').innerText = unit.name;
  document.getElementById('popup-desc').innerText = unit.class;
  p.style.borderColor = unit.color;
  p.style.display='block';
  setTimeout(()=>{p.style.display='none';},3500);
  updateRoster();
  updateHUD();
}

// ── ROSTER BAR ───────────────────────────────────
function updateRoster(){
  const bar = document.getElementById('roster-chips');
  bar.innerHTML='';
  Object.values(UNITS).forEach(u=>{
    const chip = document.createElement('div');
    const isUnlocked = STATE.unlocks.has(u.id);
    chip.className = `unit-chip ${isUnlocked?'unlocked':'locked'}`;
    chip.innerHTML = `<span class="chip-dot"></span>${u.icon} ${u.name.split(' ')[0]}${u.isBoss?' ⚠':''}`;
    chip.style.borderColor = isUnlocked ? u.color+'44' : '';
    chip.style.color = isUnlocked ? u.color : '';
    if(isUnlocked){
      chip.onclick=()=>{playUIClick();openModal(u.id);};
    }
    bar.appendChild(chip);
  });
}

// ── HUD UPDATE ───────────────────────────────────
function updateHUD(){
  const totalCards = Object.keys(UNITS).filter(k=>!UNITS[k].isBoss).length;
  document.getElementById('hud-cards').innerText = `${STATE.unlocks.size}/${totalCards}`;
}

function setThreat(pct){
  document.getElementById('threat-fill').style.width=pct+'%';
  const hud = document.getElementById('hud-status');
  if(pct>80){hud.innerText='CRITICAL';hud.style.color='var(--red)';}
  else if(pct>50){hud.innerText='ELEVATED';hud.style.color='#ff8844';}
  else{hud.innerText='ACTIVE';hud.style.color='var(--green)';}
}

// ── UNIT MODAL ───────────────────────────────────
function openModal(unitId){
  const u = UNITS[unitId];
  if(!u) return;
  const modal = document.getElementById('unit-modal');
  const body = document.getElementById('modal-body');
  const isUnlocked = STATE.unlocks.has(unitId) || u.isBoss;
  const statusClass = u.isBoss?'boss':(isUnlocked?'active':'locked');
  const statusText = u.isBoss?'⚠ HOSTILE — BOSS ENTITY':(isUnlocked?'● ACTIVE — FIELD DEPLOYED':'○ LOCKED — NOT ACQUIRED');

  const loadoutHTML = u.loadout.map(l=>`
    <li class="loadout-item">
      <span class="loadout-icon">${l.icon}</span>
      <div>
        <div class="loadout-name">${l.name}</div>
        <div class="loadout-desc">${l.desc}</div>
      </div>
    </li>`).join('');

  const skillsHTML = u.skills.map((s,i)=>{
    const isLast = i===u.skills.length-1;
    const nodeStyle = `color:${u.color}`;
    return `
      <div class="skill-row">
        <div class="skill-node ${s.locked?'locked':'active'}" style="${isUnlocked||u.isBoss?nodeStyle:''}">
          <div class="skill-node-name" style="${isUnlocked||u.isBoss?'color:'+u.color:''}">${s.name}</div>
          <div class="skill-node-desc">${s.desc}</div>
          <div class="skill-node-type">${s.type}</div>
        </div>
        ${!isLast?`<div class="skill-connector ${!s.locked?'active':''}" style="${isUnlocked?'background:'+u.color:''}"></div>`:''}
      </div>`;
  }).join('');

  body.innerHTML=`
    <div class="unit-portrait" style="background:linear-gradient(160deg,${u.color}15,${u.color}05);">
      <div style="font-size:90px;filter:drop-shadow(0 0 30px ${u.color});">${u.icon}</div>
      <div class="portrait-overlay"></div>
    </div>

    <div class="unit-section">
      <div class="unit-name" style="color:${u.color};">${u.name}</div>
      <div class="unit-class">${u.class}</div>
      <div class="unit-class" style="margin-top:3px;color:${u.color}88;">${u.rank}</div>
      <div class="status-badge ${statusClass}">${statusText}</div>
      <div class="unit-lore">${u.lore}</div>
    </div>

    <div class="unit-section">
      <div class="section-label">LOADOUT</div>
      <ul class="loadout-list">${loadoutHTML}</ul>
    </div>

    <div class="unit-section">
      <div class="section-label">SKILL TREE</div>
      <div class="skill-tree">${skillsHTML}</div>
    </div>
  `;

  modal.classList.add('open');
  playUIClick();
}

function closeModal(){
  document.getElementById('unit-modal').classList.remove('open');
  playUIClick();
}

// ── SCENE RENDERER ────────────────────────────────
function goTo(sceneId, extraFlag){
  if(extraFlag) STATE.flags.add(extraFlag);

  triggerTransition(()=>{
    STATE.currentScene = sceneId;
    renderScene(sceneId);
  });
}

function renderScene(sceneId){
  const scene = SCENES[sceneId];
  if(!scene) return;

  // Handle FINAL scene specially
  if(sceneId === 'FINAL'){
    triggerFinal();
    return;
  }

  // Check for card unlock from this scene
  const cardToUnlock = scene.unlockCard || SCENE_UNLOCK_MAP[sceneId];
  if(cardToUnlock && !STATE.unlocks.has(cardToUnlock)){
    setTimeout(()=>unlockCard(cardToUnlock), 1200);
  }

  // Update scene header
  document.getElementById('scene-id-label').innerText = scene.id;
  document.getElementById('scene-status').innerText = '● '+scene.status;

  // Update HUD
  document.getElementById('hud-mission').innerText = scene.label.split('—')[0].trim().substring(0,15);
  setThreat(scene.threat);

  // Visual panel
  document.getElementById('vis-bg').style.background = scene.bg;
  document.getElementById('vis-icon').innerText = scene.icon;
  document.getElementById('vis-icon').style.color = scene.iconColor;
  document.getElementById('vis-label').innerText = scene.sublabel;

  // Alert
  const alertEl = document.getElementById('alert-banner');
  if(scene.alert){
    alertEl.style.display='block';
    alertEl.innerText=scene.alert;
    if(scene.id==='ENGINE_HALL'){screenShake(600);playBossAlert();}
  } else {
    alertEl.style.display='none';
  }

  // Narration typewriter
  const narEl = document.getElementById('narration-text');
  typeWrite(scene.narration, narEl, 16, ()=>{
    if(STATE.narrationOn) speakNarration();
  });

  // Unlock info box
  const uiBox = document.getElementById('unlock-info');
  const uiText = document.getElementById('unlock-text');
  if(scene.unlockInfo){
    uiBox.style.display='block';
    uiText.innerText=scene.unlockInfo;
  } else {
    uiBox.style.display='none';
  }

  // Render choices
  renderChoices(scene.choices, scene.flag);

  // Scroll to top
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderChoices(choices, sceneFlag){
  const panel = document.getElementById('choices-panel');
  panel.innerHTML='';
  if(!choices || choices.length===0) return;

  choices.forEach(c=>{
    if(c.gated && !STATE.unlocks.has(c.card)) return; // Hide locked choices player doesn't have

    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (c.gated?' card-gated':'');
    btn.innerText = c.label;
    if(c.cardLabel) btn.setAttribute('data-card',c.cardLabel);
    btn.onclick = ()=>{
      playUIClick();
      const nextFlag = c.flag || sceneFlag || null;
      goTo(c.next, nextFlag);
    };
    panel.appendChild(btn);
  });
}

// ── FINAL SCENE / ENDINGS ────────────────────────
function triggerFinal(){
  // Determine ending based on flags
  const flags = STATE.flags;
  const hasCore = flags.has('core_stabilized');
  const hasDisrupt = flags.has('disrupted');
  const hasPhase = flags.has('phase_hit');
  const hasStealth = flags.has('stealth_preserved') || flags.has('contacts_cleared');

  let ending;
  const specialCount = [hasCore,hasDisrupt,hasPhase].filter(Boolean).length;

  if(specialCount >= 2){
    ending = 'SUCCESS';
  } else if(specialCount === 1 || hasStealth){
    ending = 'PARTIAL';
  } else {
    ending = 'FAILURE';
  }

  setTimeout(()=>showEnding(ending), 800);
}

function showEnding(type){
  const el = document.getElementById('ending');
  const typeEl = document.getElementById('ending-type');
  const titleEl = document.getElementById('ending-title');
  const bodyEl = document.getElementById('ending-body');

  if(type==='SUCCESS'){
    el.style.background='linear-gradient(160deg,#020a04,#020306)';
    typeEl.style.color='var(--green)';
    typeEl.innerText='// MISSION SUCCESS — FULL OBJECTIVE ACHIEVED';
    titleEl.style.color='var(--green)';
    titleEl.innerText='ENGINE STABILIZED.\nSIREN CONTAINED.';
    bodyEl.innerText="The arcane-mechanical core falls silent. Taur-Nuphari — what remains of her — collapses into the receding floodwater, voice finally extinguished. CST-ERT holds the Engine Hall. The Swamp Wards stop breathing. For the first time in months, the silence is the right kind.";
    playEndingSuccess();
  } else if(type==='PARTIAL'){
    el.style.background='linear-gradient(160deg,#0a0700,#020306)';
    typeEl.style.color='var(--gold)';
    typeEl.innerText='// PARTIAL SUCCESS — OBJECTIVE COMPROMISED';
    titleEl.style.color='var(--gold)';
    titleEl.innerText='ENGINE DISABLED.\nSIREN ESCAPED.';
    bodyEl.innerText="The Engine goes dark — flooding recedes, Rift tears close. A victory. But Taur-Nuphari tears through a dimensional breach before CST-ERT can close the net. Her voice fades into the Rift static. She'll be back. She's always back. You bought time. Use it.";
    playTone(440,0.5,'sine',0.1); playTone(330,0.8,'sine',0.08,0.4);
  } else {
    el.style.background='linear-gradient(160deg,#0a0202,#020306)';
    typeEl.style.color='var(--red)';
    typeEl.innerText='// MISSION FAILURE — NUCLEAR FORGE PROTOCOL TRIGGERED';
    titleEl.style.color='var(--red)';
    titleEl.innerText='ENGINE OVERLOAD.\nSWAMP WARDS LOST.';
    bodyEl.innerText="The Engine screams. Taur-Nuphari's final song detonates the arcane-mechanical core in a Rift cascade that liquefies everything within four hundred meters. The Nuclear Forge Protocol triggers automatically. CST-ERT extracts with seconds to spare. The Swamp Wards are gone. A new Rift zone blooms in their place.";
    screenShake(800); triggerGlitch(500);
    playEndingFailure();
  }

  el.classList.add('show');
}

function restartGame(){
  STATE.currentScene='INTRO';
  STATE.unlocks.clear();
  STATE.flags.clear();
  STATE.typewriterActive=false;
  if(STATE.typewriterTimeout) clearTimeout(STATE.typewriterTimeout);
  if(speechSynthesis) speechSynthesis.cancel();
  document.getElementById('ending').classList.remove('show');
  updateRoster();
  updateHUD();
  renderScene('INTRO');
  playUIClick();
}

// ── AUTO-UNLOCK ALCHEMIST CARD ON SCAN_ALCHEMIST ──
// (Player selects alchemist option, but needs alchemist card to access it — so give them one more card to start)
// Solution: give player alchemist card if they navigate to that scene via specific route
// Actually for the scan scene — alchemist is a gated choice. Player needs the card. 
// Let's seed one starting card based on the insertion choice.
// We handle this by unlocking in the insertion scenes.

// ── INIT ─────────────────────────────────────────
function init(){
  // Unlock boss dossier always (enemy intel)
  STATE.unlocks.add('taur_nuphari');
  updateRoster();
  updateHUD();
  renderScene('INTRO');

  // Periodic glitch ambience
  setInterval(()=>{
    if(Math.random()<0.15) triggerGlitch(80);
  }, 8000);

  // Close modal on outside click
  document.addEventListener('click',e=>{
    const modal=document.getElementById('unit-modal');
    if(modal.classList.contains('open') && !modal.contains(e.target)){
      const chips=document.getElementById('roster-bar');
      if(!chips.contains(e.target)) closeModal();
    }
  });
}

window.addEventListener('load',init);
</script>
</body>
