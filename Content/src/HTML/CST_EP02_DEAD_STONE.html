<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CST // EP.02 — DEAD STONE STATION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --void:#040205;
  --panel:#0c0810;
  --panel2:#140f1a;
  --border:#2a1a30;
  --gold:#c8920a;
  --gold-bright:#f0b030;
  --cyan:#00d4ff;
  --red:#ff2a2a;
  --green:#00ff88;
  --purple:#9d4dff;
  --orange:#ff7730;
  --text:#e8d8f0;
  --dim:#6a5080;
  --scan:#ff000006;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--void);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* SCANLINES — red-tinted for EP.02 */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px);
  pointer-events:none;
  z-index:9999;
}

/* TOP HUD */
#hud{
  position:fixed;top:0;left:0;right:0;
  background:#04020599;
  border-bottom:1px solid var(--orange);
  backdrop-filter:blur(8px);
  padding:0 20px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:500;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;gap:12px;
}
.hud-brand{color:var(--orange);font-size:13px;font-weight:700;letter-spacing:3px;}
.hud-center{display:flex;gap:20px;align-items:center;}
.hud-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hud-label{color:var(--dim);font-size:9px;letter-spacing:2px;}
.hud-val{color:var(--orange);font-size:12px;}
.hud-right{display:flex;gap:10px;align-items:center;}

/* CARRYOVER BANNER */
#carryover-bar{
  position:fixed;top:52px;left:0;right:0;
  background:#1a0a0088;
  border-bottom:1px solid var(--orange)44;
  padding:6px 20px;
  display:none;
  z-index:490;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:var(--orange);
  letter-spacing:2px;
  align-items:center;gap:12px;
}
#carryover-bar.show{display:flex;}
#carryover-chips{display:flex;gap:6px;flex-wrap:wrap;}
.carry-chip{
  background:#ff773018;border:1px solid var(--orange)55;
  padding:2px 8px;border-radius:2px;
  font-size:9px;color:var(--orange);
}

/* THREAT BAR */
.threat-wrap{width:120px;}
.threat-track{height:4px;background:#111;border:1px solid #333;border-radius:2px;overflow:hidden;}
.threat-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--red));width:0%;transition:width 0.8s cubic-bezier(.4,0,.2,1);}

/* MAIN */
#main{
  max-width:780px;margin:0 auto;
  padding:90px 20px 200px;
}
#main.has-carryover{padding-top:120px;}

/* SCENE */
.scene-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
  border-bottom:1px solid var(--border);
  padding-bottom:10px;
}
.scene-id{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:3px;}
.scene-status{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--orange);letter-spacing:2px;}

/* VISUAL PANEL */
.vis-panel{
  width:100%;height:280px;
  border:1px solid var(--border);
  margin-bottom:16px;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.vis-bg{position:absolute;inset:0;}
.vis-label{
  position:absolute;
  font-family:'Orbitron',monospace;font-size:11px;
  letter-spacing:4px;color:rgba(255,255,255,0.1);
  text-align:center;padding:20px;z-index:1;
}
.vis-icon{font-size:72px;z-index:2;filter:drop-shadow(0 0 20px currentColor);}
.vis-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,var(--void) 100%);
  z-index:3;
}

/* NARRATION */
#narration-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--orange);
  padding:20px 24px;margin-bottom:16px;
  min-height:80px;position:relative;
}
#narration-text{font-size:16px;line-height:1.7;font-weight:400;color:#d0b8d8;}
.narration-cursor{
  display:inline-block;width:2px;height:16px;
  background:var(--orange);margin-left:2px;
  animation:blink 0.8s infinite;vertical-align:middle;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.narration-read-btn{
  position:absolute;top:12px;right:12px;
  background:transparent;border:1px solid var(--border);
  color:var(--dim);font-size:14px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:2px;transition:all 0.2s;
}
.narration-read-btn:hover{color:var(--orange);border-color:var(--orange);}

/* INTEL BOX */
#intel-box{
  display:none;
  background:#1a0a0288;
  border:1px solid var(--orange)55;
  border-left:3px solid var(--orange);
  padding:14px 18px;margin-bottom:12px;
}
.intel-label{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:var(--orange);letter-spacing:3px;margin-bottom:8px;
}
#intel-text{font-size:13px;color:#ffb070;line-height:1.6;}

/* ALERT */
#alert-banner{
  display:none;
  background:#ff2a2a10;border:1px solid var(--red);
  border-left:3px solid var(--red);
  padding:10px 16px;margin-bottom:12px;
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--red);letter-spacing:2px;
}

/* CHOICES */
#choices-panel{display:flex;flex-direction:column;gap:8px;margin-bottom:32px;}
.choice-btn{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:14px 20px;
  font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;text-align:left;position:relative;
  transition:all 0.2s;display:flex;align-items:center;gap:12px;letter-spacing:1px;
}
.choice-btn:hover{background:var(--panel2);border-color:var(--orange);color:#ffb070;padding-left:28px;}
.choice-btn::before{content:'▸';color:var(--orange);opacity:0;transition:opacity 0.2s;}
.choice-btn:hover::before{opacity:1;}
.choice-btn.card-gated{border-color:#9d4dff44;color:#c0a0ff;}
.choice-btn.card-gated::after{
  content:attr(data-card);position:absolute;right:14px;
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--purple);letter-spacing:2px;
}
.choice-btn.card-gated:hover{border-color:var(--purple);color:#ddc0ff;}
.choice-btn.carry-gated{border-color:#ff773055;color:#ffb070;}
.choice-btn.carry-gated::after{
  content:attr(data-card);position:absolute;right:14px;
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--orange);letter-spacing:2px;
}
.choice-btn.carry-gated:hover{border-color:var(--orange);color:#ffd0a0;}
.choice-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ROSTER BAR */
#roster-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#04020599;border-top:1px solid var(--border);
  backdrop-filter:blur(8px);padding:8px 20px;
  display:flex;gap:8px;align-items:center;z-index:500;overflow-x:auto;
}
.roster-label{
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--dim);
  letter-spacing:2px;white-space:nowrap;margin-right:4px;
}
.unit-chip{
  background:var(--panel);border:1px solid var(--border);
  padding:5px 10px 5px 8px;
  font-family:'Share Tech Mono',monospace;font-size:10px;
  cursor:pointer;white-space:nowrap;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;border-radius:2px;
}
.unit-chip:hover{border-color:var(--orange);color:var(--orange);}
.unit-chip.unlocked{border-color:#333;}
.unit-chip.carried{border-color:var(--orange)33;}
.unit-chip.locked{opacity:0.4;cursor:default;}
.unit-chip .chip-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.unit-chip.unlocked .chip-dot{background:var(--green);}
.unit-chip.carried .chip-dot{background:var(--orange);}
.unit-chip.locked .chip-dot{background:#333;}

/* UNIT MODAL */
#unit-modal{
  position:fixed;top:0;right:-500px;width:460px;height:100%;
  background:#050208;border-left:1px solid var(--orange);
  z-index:800;overflow-y:auto;
  transition:right 0.4s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#unit-modal.open{right:0;}
#modal-close{
  position:sticky;top:0;background:#050208;
  border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;
}
#modal-close-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--dim);font-size:16px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:2px;transition:all 0.2s;
}
#modal-close-btn:hover{color:var(--red);border-color:var(--red);}
.modal-title{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:3px;}

/* MODAL BODY */
.unit-portrait{
  width:100%;height:200px;
  display:flex;align-items:center;justify-content:center;font-size:90px;
  position:relative;overflow:hidden;
}
.portrait-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,#050208);height:60px;
}
.unit-section{padding:16px 20px;border-bottom:1px solid var(--border);}
.unit-name{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;margin-bottom:4px;}
.unit-class{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--dim);}
.unit-lore{font-size:14px;line-height:1.6;color:#b090c0;margin-top:10px;}
.status-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid;
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  margin-top:10px;border-radius:2px;
}
.status-badge.active{border-color:var(--green);color:var(--green);}
.status-badge.carried{border-color:var(--orange);color:var(--orange);}
.status-badge.locked{border-color:var(--dim);color:var(--dim);}
.status-badge.boss{border-color:var(--red);color:var(--red);}
.loadout-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.loadout-item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);padding:8px 12px;font-size:13px;
}
.loadout-icon{font-size:16px;}
.loadout-name{font-weight:600;color:var(--text);}
.loadout-desc{font-size:11px;color:var(--dim);margin-top:2px;}
.skill-tree{display:flex;flex-direction:column;gap:4px;margin-top:12px;}
.skill-row{display:flex;align-items:center;gap:0;}
.skill-node{
  background:var(--panel);border:1px solid var(--border);
  padding:10px 14px;flex:1;cursor:default;position:relative;transition:all 0.2s;
}
.skill-node.active{border-color:currentColor;}
.skill-node.locked{opacity:0.45;}
.skill-node-name{font-size:12px;font-weight:700;letter-spacing:1px;}
.skill-node-desc{font-size:10px;color:var(--dim);margin-top:3px;}
.skill-node-type{position:absolute;top:6px;right:8px;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--dim);}
.skill-connector{width:24px;height:1px;background:var(--border);flex-shrink:0;}
.skill-connector.active{background:currentColor;opacity:0.5;}
.section-label{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--orange);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* CARD POPUP */
#card-popup{
  position:fixed;top:70px;right:20px;
  background:var(--panel);border:1px solid var(--orange);
  padding:14px 18px;display:none;z-index:700;max-width:260px;
  animation:slideIn 0.3s ease;
}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.popup-header{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--orange);letter-spacing:3px;margin-bottom:8px;}
.popup-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.popup-desc{font-size:11px;color:var(--dim);}

/* ENDING */
#ending{
  display:none;position:fixed;inset:0;background:var(--void);z-index:900;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px;text-align:center;
}
#ending.show{display:flex;}
.ending-type{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:5px;margin-bottom:20px;}
.ending-title{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;margin-bottom:20px;line-height:1.2;white-space:pre-line;}
.ending-body{font-size:16px;color:#9a80b0;max-width:500px;line-height:1.7;margin-bottom:10px;}
.ending-save-note{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:30px;}
.ending-btn{
  background:transparent;padding:12px 28px;
  font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;
  cursor:pointer;transition:all 0.2s;border:1px solid;
}
.ending-btn:hover{filter:brightness(1.3);}
.ending-btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

/* ANIMATIONS */
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,4px)}80%{transform:translate(3px,-2px)}100%{transform:translate(0)}}
.shaking{animation:shake 0.4s ease;}
@keyframes sceneFade{0%{opacity:0;filter:brightness(3) saturate(0)}30%{opacity:1;filter:brightness(1.2)}100%{opacity:1;filter:brightness(1)}}
#scene-wrap{animation:sceneFade 0.6s ease;}
@keyframes glitchPulse{0%{clip-path:inset(0 0 100% 0)}10%{clip-path:inset(30% 0 40% 0)}20%{clip-path:inset(70% 0 10% 0)}30%{clip-path:inset(10% 0 80% 0)}40%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 100% 0)}}
#glitch-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;background:rgba(255,100,0,0.03);opacity:0;transition:opacity 0.1s;}
#glitch-overlay.active{opacity:1;animation:glitchPulse 0.15s steps(1);}

/* AUDIO INDICATOR */
.audio-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;transition:background 0.3s;}
.audio-dot.active{background:var(--green);animation:audioPulse 1s infinite;}
@keyframes audioPulse{0%,100%{opacity:1}50%{opacity:0.4}}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#000;}
::-webkit-scrollbar-thumb{background:var(--border);}
::-webkit-scrollbar-thumb:hover{background:var(--orange);}
</style>
</head>
<body>

<div id="glitch-overlay"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-brand">CST // EP.02</div>
  <div class="hud-center">
    <div class="hud-stat">
      <div class="hud-label">MISSION</div>
      <div class="hud-val" id="hud-mission">DEAD STONE</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">THREAT</div>
      <div class="threat-wrap"><div class="threat-track"><div class="threat-fill" id="threat-fill"></div></div></div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">CARDS</div>
      <div class="hud-val" id="hud-cards">0/6</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">STATUS</div>
      <div class="hud-val" id="hud-status">ACTIVE</div>
    </div>
  </div>
  <div class="hud-right">
    <span class="audio-dot" id="audio-dot"></span>
    <button onclick="toggleNarration()" style="background:transparent;border:1px solid var(--border);color:var(--dim);padding:4px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:2px;" id="narr-btn">NARR OFF</button>
  </div>
</div>

<!-- CARRYOVER BAR -->
<div id="carryover-bar">
  <span>// EP.01 CARRY-OVER:</span>
  <div id="carryover-chips"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="scene-wrap">
    <div class="scene-header">
      <div class="scene-id" id="scene-id-label">BRIEFING</div>
      <div class="scene-status" id="scene-status">● LOADING</div>
    </div>
    <div class="vis-panel" id="vis-panel">
      <div class="vis-bg" id="vis-bg"></div>
      <div class="vis-icon" id="vis-icon">💀</div>
      <div class="vis-label" id="vis-label">DEAD STONE STATION</div>
      <div class="vis-overlay"></div>
    </div>
    <div id="alert-banner"></div>
    <div id="narration-box">
      <div id="narration-text"></div>
      <button class="narration-read-btn" onclick="speakNarration()" title="Read aloud">🔊</button>
    </div>
    <div id="choices-panel"></div>
    <div id="intel-box">
      <div class="intel-label">// FIELD INTEL</div>
      <div id="intel-text"></div>
    </div>
  </div>
</div>

<!-- ROSTER -->
<div id="roster-bar">
  <div class="roster-label">UNIT DB ▸</div>
  <div id="roster-chips"></div>
</div>

<!-- UNIT MODAL -->
<div id="unit-modal">
  <div id="modal-close">
    <div class="modal-title">// UNIT DOSSIER</div>
    <button id="modal-close-btn" onclick="closeModal()">✕</button>
  </div>
  <div id="modal-body"></div>
</div>

<!-- CARD POPUP -->
<div id="card-popup">
  <div class="popup-header">▲ UNIT CARD ACQUIRED</div>
  <div class="popup-name" id="popup-name"></div>
  <div class="popup-desc" id="popup-desc"></div>
</div>

<!-- ENDING SCREEN -->
<div id="ending">
  <div class="ending-type" id="ending-type"></div>
  <div class="ending-title" id="ending-title"></div>
  <div class="ending-body" id="ending-body"></div>
  <div class="ending-save-note" id="ending-save-note"></div>
  <div class="ending-btn-row" id="ending-btns"></div>
</div>

<script>
/* =============================================
   CST EPISODE 02 — DEAD STONE STATION
   Terror King Protocol
   Systems: Save/Load, Card Carry-Over, Full Branch
   ============================================= */

// ── UNIT DATABASE (EP.02 ROSTER) ───────────────
const UNITS = {
  // EP.01 CARRY-OVER UNITS (core descriptions abbreviated)
  forge_mystic:{id:'forge_mystic',name:'FORGE MYSTIC',icon:'⚙️',class:'ARCANE-MECHANICAL SPECIALIST',rank:'SENIOR OPERATIVE',color:'#c8920a',isCarryOver:true,

    skills:[{name:'CORE FLOW',desc:'Stabilize or redirect arcane machinery.',type:'ACTIVE',active:true},{name:'STEAM WALL',desc:'Tactical barrier. -40% incoming damage.',type:'PASSIVE',active:true},{name:'FORGE COMMUNION',desc:'Full machine control in radius.',type:'ULTIMATE',active:false,locked:true}]
  },
  rail_worker:{id:'rail_worker',name:'RAIL WORKER',icon:'🚂',class:'INFRASTRUCTURE SPECIALIST',rank:'FIELD OPERATIVE',color:'#00d4ff',isCarryOver:true,
    lore:"The Dead Stone Station rail system has been dead for years. The Rail Worker reads dead systems like others read heartbeats. Every collapsed route still has a ghost path.",
    loadout:[{icon:'🗺️',name:'Ward Map Implant',desc:'Neural-mapped tunnel network. Reveals hidden routes.'},{icon:'🔩',name:'Track Spike Launcher',desc:'Electrified rail spikes. Stuns mechanical units.'},{icon:'🚇',name:'Rail Authority Badge',desc:'Opens any CST-maintained infrastructure.'}],
    skills:[{name:'TUNNEL SENSE',desc:'Detect hidden passages and dead routes.',type:'PASSIVE',active:true},{name:'RAIL BYPASS',desc:'Open restricted infrastructure routes.',type:'ACTIVE',active:true},{name:'GHOST TRANSIT',desc:'Move entire squad undetected.',type:'ULTIMATE',active:false,locked:true}]
  },
  drone_pilot:{id:'drone_pilot',name:'DRONE PILOT',icon:'🛸',class:'AERIAL RECONNAISSANCE',rank:'FIELD OPERATIVE',color:'#00ff88',isCarryOver:true,
    lore:"Dead Stone Station is a maze of collapsed catwalks and sealed chambers. The drones fly where boots cannot. What the drones see, the squad knows.",
    loadout:[{icon:'📡',name:'Scout Swarm Array',desc:'12 micro-drones. Full thermal map of sector.'},{icon:'💥',name:'Payload Drones',desc:'Strike-capable on pilot command.'},{icon:'🔋',name:'Power Relay Drone',desc:'Extends comm range, jams enemy sensors.'}],
    skills:[{name:'THERMAL SWEEP',desc:'Full enemy reveal in sector.',type:'ACTIVE',active:true},{name:'RECON NET',desc:'Persistent coverage. Enemies flagged on move.',type:'PASSIVE',active:true},{name:'SWARM STRIKE',desc:'All drones simultaneous multi-target strike.',type:'ULTIMATE',active:false,locked:true}]
  },

// ── AUDIO ENGINE ──────────────────────────────────
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq,dur,type='sine',vol=0.08,delay=0){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,ctx.currentTime+delay);
    gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+delay+0.05);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+dur);
    osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+dur+0.1);
  }catch(e){}
}

// ── NARRATION ─────────────────────────────────────
let currentSpeech=null;
function speakNarration(){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const text=document.getElementById('narration-text').innerText.replace(/\n/g,' ');
  if(!text.trim())return;
  currentSpeech=new SpeechSynthesisUtterance(text);
  currentSpeech.rate=0.88;currentSpeech.pitch=0.82;currentSpeech.volume=0.9;
  const dot=document.getElementById('audio-dot');
  dot.classList.add('active');
  currentSpeech.onend=()=>dot.classList.remove('active');
  speechSynthesis.speak(currentSpeech);
}
function toggleNarration(){
  STATE.narrationOn=!STATE.narrationOn;
  document.getElementById('narr-btn').innerText=STATE.narrationOn?'NARR ON':'NARR OFF';
  document.getElementById('narr-btn').style.color=STATE.narrationOn?'var(--green)':'var(--dim)';
  if(!STATE.narrationOn&&speechSynthesis)speechSynthesis.cancel();
}

// ── TYPEWRITER ────────────────────────────────────
function typeWrite(text,el,speed=18,callback){
  if(STATE.typewriterTimeout)clearTimeout(STATE.typewriterTimeout);
  el.innerHTML='';
  const cursor=document.createElement('span');cursor.className='narration-cursor';
  let i=0;
  function step(){
    if(i<text.length){
      const ch=text[i];
      if(ch==='\n')el.appendChild(document.createElement('br'));
      else el.appendChild(document.createTextNode(ch));
      i++;STATE.typewriterTimeout=setTimeout(step,ch==='\n'?speed*5:speed);
    } else {
      if(el.contains(cursor))el.removeChild(cursor);
      if(callback)callback();
    }
  }
  el.appendChild(cursor);step();
}

      document.getElementById('scene-wrap').style.transition='none';
      document.getElementById('scene-wrap').style.opacity='1';
      setTimeout(()=>document.getElementById('scene-wrap').style.transition='',50);
    },200);
  },50);
}

// ── CARD UNLOCK ───────────────────────────────────
function unlockCard(cardId){
  if(STATE.unlocks.has(cardId))return;
  STATE.unlocks.add(cardId);
  playCardUnlock();
  const unit=UNITS[cardId];if(!unit)return;
  const p=document.getElementById('card-popup');
  document.getElementById('popup-name').innerText=unit.name;
  document.getElementById('popup-desc').innerText=unit.class;
  p.style.borderColor=unit.color;p.style.display='block';
  setTimeout(()=>{p.style.display='none';},3500);
  updateRoster();updateHUD();
}

// ── HUD ───────────────────────────────────────────
function setThreat(pct){
  document.getElementById('threat-fill').style.width=pct+'%';
  const h=document.getElementById('hud-status');
  if(pct>80){h.innerText='CRITICAL';h.style.color='var(--red)';}
  else if(pct>55){h.innerText='ELEVATED';h.style.color='#ff8844';}
  else{h.innerText='ACTIVE';h.style.color='var(--green)';}
}
function updateHUD(){
  const ep2Units=Object.keys(UNITS).filter(k=>!UNITS[k].isCarryOver&&!UNITS[k].isBoss);
  const ep2Unlocked=[...STATE.unlocks].filter(u=>ep2Units.includes(u));
  document.getElementById('hud-cards').innerText=`${ep2Unlocked.length}/${ep2Units.length}`;
}

// ── ROSTER ────────────────────────────────────────
function updateRoster(){
  const bar=document.getElementById('roster-chips');bar.innerHTML='';
  Object.values(UNITS).forEach(u=>{
    const isUnlocked=STATE.unlocks.has(u.id);
    const isCarried=STATE.carriedUnlocks.has(u.id);
    const chip=document.createElement('div');
    let cls='unit-chip';
    if(isUnlocked)cls+=' unlocked';
    else if(isCarried)cls+=' carried';
    else cls+=' locked';
    chip.className=cls;
    chip.innerHTML=`<span class="chip-dot"></span>${u.icon} ${u.name.split(' ').slice(0,2).join(' ')}${u.isBoss?' ⚠':''}${u.isCarryOver&&isCarried?' ↑':''}`;
    if(u.color&&(isUnlocked||isCarried)){chip.style.borderColor=u.color+'44';chip.style.color=u.color;}
    if(isUnlocked||isCarried){chip.onclick=()=>{playUIClick();openModal(u.id);};}
    bar.appendChild(chip);
  });
}

// ── MODAL ─────────────────────────────────────────
function openModal(unitId){
  const u=UNITS[unitId];if(!u)return;
  const modal=document.getElementById('unit-modal');
  const body=document.getElementById('modal-body');
  const isUnlocked=STATE.unlocks.has(unitId);
  const isCarried=STATE.carriedUnlocks.has(unitId);
  const statusClass=u.isBoss?'boss':(isUnlocked?'active':(isCarried?'carried':'locked'));
  const statusText=u.isBoss?'⚠ HOSTILE — BOSS ENTITY':(isUnlocked?'● ACTIVE — EP.02 ACQUIRED':(isCarried?'↑ CARRIED — FROM EP.01':'○ LOCKED — NOT ACQUIRED'));

  const loadoutHTML=u.loadout.map(l=>`<li class="loadout-item"><span class="loadout-icon">${l.icon}</span><div><div class="loadout-name">${l.name}</div><div class="loadout-desc">${l.desc}</div></div></li>`).join('');
  const skillsHTML=u.skills.map((s,i)=>{
    const isLast=i===u.skills.length-1;
    return `<div class="skill-row"><div class="skill-node ${s.locked?'locked':'active'}" style="${isUnlocked||isCarried||u.isBoss?'color:'+u.color:''}"><div class="skill-node-name" style="${isUnlocked||isCarried||u.isBoss?'color:'+u.color:''}">${s.name}</div><div class="skill-node-desc">${s.desc}</div><div class="skill-node-type">${s.type}</div></div>${!isLast?`<div class="skill-connector active" style="background:${u.color};opacity:0.4;"></div>`:''}</div>`;
  }).join('');

  body.innerHTML=`
    <div class="unit-portrait" style="background:linear-gradient(160deg,${u.color}15,${u.color}05);">
      <div style="font-size:90px;filter:drop-shadow(0 0 30px ${u.color});">${u.icon}</div>
      <div class="portrait-overlay"></div>
    </div>
    <div class="unit-section">
      <div class="unit-name" style="color:${u.color};">${u.name}</div>
      <div class="unit-class">${u.class}</div>
      <div class="unit-class" style="margin-top:3px;color:${u.color}88;">${u.rank}</div>
      ${u.isCarryOver?`<div style="margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--orange);letter-spacing:2px;">↑ CARRY-OVER FROM EP.01</div>`:''}
      <div class="status-badge ${statusClass}">${statusText}</div>
      <div class="unit-lore">${u.lore}</div>
    </div>
    <div class="unit-section"><div class="section-label">LOADOUT</div><ul class="loadout-list">${loadoutHTML}</ul></div>
    <div class="unit-section"><div class="section-label">SKILL TREE</div><div class="skill-tree">${skillsHTML}</div></div>`;

  modal.classList.add('open');playUIClick();
}
function closeModal(){document.getElementById('unit-modal').classList.remove('open');playUIClick();}

// ── SCENE RENDERER ────────────────────────────────
function goTo(sceneId,extraFlag){
  if(extraFlag)STATE.flags.add(extraFlag);
  triggerTransition(()=>{STATE.currentScene=sceneId;renderScene(sceneId);});
}

function renderScene(sceneId){
  const scene=SCENES[sceneId];if(!scene)return;
  if(sceneId==='FINAL'){triggerFinal();return;}

  // Unlock card for this scene
  if(scene.unlockCard&&!STATE.unlocks.has(scene.unlockCard)){
    setTimeout(()=>unlockCard(scene.unlockCard),1200);
  }

  // Scene header
  document.getElementById('scene-id-label').innerText=scene.id;
  document.getElementById('scene-status').innerText='● '+scene.status;
  document.getElementById('hud-mission').innerText=scene.id.substring(0,12);
  setThreat(scene.threat);

  // Visual
  document.getElementById('vis-bg').style.background=scene.bg;
  document.getElementById('vis-icon').innerText=scene.icon;
  document.getElementById('vis-icon').style.color=scene.iconColor;
  document.getElementById('vis-label').innerText=scene.sublabel;

  // Alert
  const alertEl=document.getElementById('alert-banner');
  if(scene.alert){
    alertEl.style.display='block';alertEl.innerText=scene.alert;
    if(sceneId==='INNER_SANCTUM'){screenShake(600);playBossAlert();}
  } else {alertEl.style.display='none';}

  // Narration — supports function or string
  const narText = typeof scene.narration === 'function'
    ? scene.narration(STATE)
    : scene.narration;
  const narEl=document.getElementById('narration-text');
  typeWrite(narText,narEl,16,()=>{if(STATE.narrationOn)speakNarration();});

  // Intel box
  const ib=document.getElementById('intel-box');
  const it=document.getElementById('intel-text');
  if(scene.intelText){ib.style.display='block';it.innerText=scene.intelText;}
  else{ib.style.display='none';}

  renderChoices(scene.choices,scene.flag);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderChoices(choices,sceneFlag){
  const panel=document.getElementById('choices-panel');panel.innerHTML='';
  if(!choices||choices.length===0)return;
  choices.forEach(c=>{
    const isEp1Gated = c.gated && c.source==='ep1';
    const isEp2Gated = c.gated && c.source==='ep2';
    // Hide ep1 card choices the player doesn't have
    if(isEp1Gated && !STATE.carriedUnlocks.has(c.card) && !STATE.unlocks.has(c.card)) return;
    // Hide ep2 card choices the player hasn't unlocked yet
    if(isEp2Gated && !STATE.unlocks.has(c.card)) return;

    const btn=document.createElement('button');
    let cls='choice-btn';
    if(isEp1Gated)cls+=' carry-gated';
    else if(isEp2Gated)cls+=' card-gated';
    btn.className=cls;
    btn.innerText=c.label;
    if(c.cardLabel)btn.setAttribute('data-card',c.cardLabel+(isEp1Gated?' ↑':''));
    btn.onclick=()=>{playUIClick();goTo(c.next,c.flag||sceneFlag||null);};
    panel.appendChild(btn);
  });
}

// ── FINAL ENDINGS ─────────────────────────────────
function triggerFinal(){
  const f=STATE.flags;
  const powerCards=[f.has('raijin_charge'),f.has('glitch_crash'),f.has('ancient_disrupted'),f.has('station_override')].filter(Boolean).length;
  const supportCards=[f.has('stealth_clock'),f.has('glitch_clear'),f.has('rail_cleared'),f.has('raijin_armed')].filter(Boolean).length;

  let type;
  if(powerCards>=2)type='SUCCESS';
  else if(powerCards===1||supportCards>=2)type='PARTIAL';
  else type='FAILURE';

  setTimeout(()=>showEnding(type),800);
}

function showEnding(type){
  const el=document.getElementById('ending');
  saveEP2Progress(type);

  const typeEl=document.getElementById('ending-type');
  const titleEl=document.getElementById('ending-title');
  const bodyEl=document.getElementById('ending-body');
  const noteEl=document.getElementById('ending-save-note');
  const btnsEl=document.getElementById('ending-btns');

  noteEl.innerText='// PROGRESS SAVED — EP.03 CARDS WILL CARRY FORWARD';

  if(type==='SUCCESS'){
    el.style.background='linear-gradient(160deg,#080202,#040205)';
    typeEl.style.color='var(--orange)';
    typeEl.innerText='// MISSION SUCCESS — TERROR KING DESTROYED';
    titleEl.style.color='var(--orange)';
    titleEl.innerText='DEAD STONE RECLAIMED.\nTHE KING FALLS.';
    bodyEl.innerText="The Terror King's throne shatters. The carved faces on the walls go dark — the centuries of compressed authority releasing in a wave that makes every glass surface in the building shatter simultaneously. The Boundary Portal closes. The dark matter anchor dissolves. CST-ERT walks out of the Dead Stone Station in silence. The district is intact. The King is not.";
    playEndingSuccess();
    btnsEl.innerHTML=`<button class="ending-btn" style="border-color:var(--orange);color:var(--orange);" onclick="restartGame()">⟳ REPLAY EP.02</button><button class="ending-btn" style="border-color:var(--cyan);color:var(--cyan);" onclick="goEP1()">← BACK TO EP.01</button>`;
  } else if(type==='PARTIAL'){
    el.style.background='linear-gradient(160deg,#100500,#040205)';
    typeEl.style.color='var(--gold)';
    typeEl.innerText='// PARTIAL SUCCESS — KING WOUNDED, PORTAL UNSTABLE';
    titleEl.style.color='var(--gold)';
    titleEl.innerText='ANCHOR BROKEN.\nKING RETREATS.';
    bodyEl.innerText="The dark matter anchor fractures but doesn't fully dissolve. The Terror King retreats into a dimensional fold, bleeding ancient authority from the wounds CST-ERT dealt. The station is no longer claimed. The Boundary Portal pulses but holds closed — for now. CST-ERT has a window. It won't stay open.";
    playTone(330,0.6,'sine',0.1);playTone(220,0.8,'sine',0.08,0.4);
    btnsEl.innerHTML=`<button class="ending-btn" style="border-color:var(--gold);color:var(--gold);" onclick="restartGame()">⟳ REPLAY EP.02</button><button class="ending-btn" style="border-color:var(--cyan);color:var(--cyan);" onclick="goEP1()">← BACK TO EP.01</button>`;
  } else {
    el.style.background='linear-gradient(160deg,#0d0204,#040205)';
    typeEl.style.color='var(--red)';
    typeEl.innerText='// MISSION FAILURE — ANCHOR SET — DISTRICT LOST';
    titleEl.style.color='var(--red)';
    titleEl.innerText='ANCHOR PERMANENT.\nDISTRICT CONSUMED.';
    bodyEl.innerText="The dark matter anchor locks into place. The Terror King speaks the final word — the one that completes the claim — and the district folds inward. Not destroyed. Absorbed. CST-ERT extracts through a collapsing reality membrane with nothing to show for it. Somewhere in the Void, a district that existed for two hundred years stops existing.";
    screenShake(800);triggerGlitch(600);playEndingFailure();
    btnsEl.innerHTML=`<button class="ending-btn" style="border-color:var(--red);color:var(--red);" onclick="restartGame()">⟳ RETRY MISSION</button><button class="ending-btn" style="border-color:var(--dim);color:var(--dim);" onclick="goEP1()">← BACK TO EP.01</button>`;
  }

  el.classList.add('show');
}

function goEP1(){window.location.href='CST_EP01_COLD_BREW.html';}

function restartGame(){
  STATE.currentScene='BRIEFING';
  STATE.unlocks.clear();
  STATE.flags.clear();
  if(STATE.typewriterTimeout)clearTimeout(STATE.typewriterTimeout);
  if(speechSynthesis)speechSynthesis.cancel();
  // Re-seed carry-overs
  seededCarryOvers();
  document.getElementById('ending').classList.remove('show');
  updateRoster();updateHUD();renderScene('BRIEFING');
  playUIClick();
}

// ── CARRY-OVER + INIT ────────────────────────────
function seededCarryOvers(){
  STATE.carriedUnlocks.clear();
  const save=STATE.ep1Save;
  if(save&&save.unlocks){
    save.unlocks.forEach(id=>{
      if(UNITS[id])STATE.carriedUnlocks.add(id);
    });
  }
  // Always seed anchor_gunner as minimum carry (they deployed anyway)
  STATE.carriedUnlocks.add('anchor_gunner');
}

function buildCarryoverBar(){
  const bar=document.getElementById('carryover-bar');
  const chips=document.getElementById('carryover-chips');
  if(STATE.carriedUnlocks.size===0){bar.classList.remove('show');return;}
  chips.innerHTML='';
  STATE.carriedUnlocks.forEach(id=>{
    const u=UNITS[id];if(!u)return;
    const chip=document.createElement('div');
    chip.className='carry-chip';
    chip.innerText=`${u.icon} ${u.name}`;
    chips.appendChild(chip);
  });
  bar.classList.add('show');
  document.getElementById('main').classList.add('has-carryover');
  playCarryOverJingle();
}

function init(){
  // Load EP.01 save
  STATE.ep1Save = loadEP1Save();
  seededCarryOvers();

  // Boss always visible
  STATE.unlocks.add('terror_king');

  buildCarryoverBar();
  updateRoster();
  updateHUD();
  renderScene('BRIEFING');

  // Ambient glitch
  setInterval(()=>{if(Math.random()<0.12)triggerGlitch(80);},9000);

  // Close modal on outside click
  document.addEventListener('click',e=>{
    const modal=document.getElementById('unit-modal');
    if(modal.classList.contains('open')&&!modal.contains(e.target)){
      const roster=document.getElementById('roster-bar');
      if(!roster.contains(e.target))closeModal();
    }
  });
}

window.addEventListener('load',init);
</script>
</body>
