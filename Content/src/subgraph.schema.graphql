# ─────────────────────────────────────────────────────────────────────────────
# Sentinel Protocol — Subgraph Schema
# Deploy to The Graph with `graph deploy`
# Indexes events from all four contracts into queryable entities.
# ─────────────────────────────────────────────────────────────────────────────

# ── ForgeAvatar ───────────────────────────────────────────────────────────────

type MintEvent @entity(immutable: true) {
  id:          Bytes!            # tx hash + log index
  minter:      Bytes!            # address
  tokenId:     BigInt!
  blockNumber: BigInt!
  timestamp:   BigInt!
  txHash:      Bytes!
}

type MintRateLimitHit @entity(immutable: true) {
  id:           Bytes!
  minter:       Bytes!
  blockNumber:  BigInt!
  attemptCount: BigInt!
  timestamp:    BigInt!
  txHash:       Bytes!
}

# ── ABEX ──────────────────────────────────────────────────────────────────────

type TradeEvent @entity(immutable: true) {
  id:          Bytes!
  tradeId:     BigInt!
  buyer:       Bytes!
  seller:      Bytes!
  tokenId:     BigInt!
  price:       BigInt!           # wei
  blockNumber: BigInt!
  timestamp:   BigInt!
  txHash:      Bytes!
}

type CircuitBreakerEvent @entity(immutable: true) {
  id:             Bytes!
  referencePrice: BigInt!
  tradePrice:     BigInt!
  moveBps:        BigInt!
  blockNumber:    BigInt!
  timestamp:      BigInt!
  txHash:         Bytes!
}

# ── CardCatalog ───────────────────────────────────────────────────────────────

type CardRegistration @entity(immutable: true) {
  id:           Bytes!
  cardId:       BigInt!
  registeredBy: Bytes!
  metadataURI:  String!
  timestamp:    BigInt!
  txHash:       Bytes!
}

type RoleEvent @entity(immutable: true) {
  id:        Bytes!
  eventType: String!             # "granted" | "revoked"
  role:      Bytes!              # keccak256 of role name
  account:   Bytes!
  grantor:   Bytes!
  timestamp: BigInt!
  txHash:    Bytes!
}

# ── SentinelWallet ────────────────────────────────────────────────────────────

type TransferAuthEvent @entity(immutable: true) {
  id:         Bytes!
  from:       Bytes!
  to:         Bytes!
  tokenId:    BigInt!
  nonce:      BigInt!
  structHash: Bytes!
  timestamp:  BigInt!
  txHash:     Bytes!
}

type InvalidSignatureEvent @entity(immutable: true) {
  id:         Bytes!
  caller:     Bytes!
  structHash: Bytes!
  recovered:  Bytes!             # address that signed (not the expected owner)
  timestamp:  BigInt!
  txHash:     Bytes!
}

type SignatureReplayEvent @entity(immutable: true) {
  id:         Bytes!
  signer:     Bytes!
  structHash: Bytes!
  timestamp:  BigInt!
  txHash:     Bytes!
}

# ── SentinelDenyList ──────────────────────────────────────────────────────────

type DenyListEntry @entity {
  id:        Bytes!              # wallet address — mutable so we can clear
  wallet:    Bytes!
  denied:    Boolean!
  reason:    String!
  deniedAt:  BigInt!
  clearedAt: BigInt
  operator:  Bytes!
}

# ── Cross-contract: wallet risk profile ───────────────────────────────────────
# Aggregated per-wallet for the scoring engine to query.

type WalletProfile @entity {
  id:                 Bytes!     # wallet address
  wallet:             Bytes!
  totalMints:         BigInt!
  mintRateLimitHits:  BigInt!
  totalTrades:        BigInt!
  invalidSigAttempts: BigInt!
  replayAttempts:     BigInt!
  isDenied:           Boolean!
  lastSeenBlock:      BigInt!
  lastSeenTimestamp:  BigInt!
}

# ── System-level pause events (all contracts) ─────────────────────────────────

type PauseEvent @entity(immutable: true) {
  id:          Bytes!
  contract:    String!           # "ForgeAvatar" | "ABEX" | "CardCatalog" | "SentinelWallet"
  caller:      Bytes!
  timestamp:   BigInt!
  txHash:      Bytes!
}
